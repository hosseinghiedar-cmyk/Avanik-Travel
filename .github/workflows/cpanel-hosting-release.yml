name: cPanel Hosting Release

on:
  push:
    branches:
      - release/v0.4.0-hosting-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hosting-zip:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download cPanel release builder
        run: |
          set -euo pipefail
          mkdir -p scripts
          curl -L --fail -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/build-cpanel-hosting-release.py?ref=${GITHUB_SHA}" \
            -o scripts/build-cpanel-hosting-release.py
      - name: Build cPanel-safe hosting package
        run: python3 scripts/build-cpanel-hosting-release.py
      - name: Verify package filenames and required files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('dist/Avanik-Travel-v0.4.0-Hosting-Release.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              required={'avanik/style.css','avanik/functions.php','avanik/front-page.php','avanik/inc/Theme.php','avanik/inc/ThemeSetup.php','avanik/inc/ThemeInstaller.php','avanik/inc/ThemeSettings.php','avanik/inc/ProviderAdmin.php','avanik/inc/NotificationDashboard.php','avanik/inc/NotificationProviderSettings.php','avanik/assets/js/avanik-demo.js','avanik/assets/images/avanik-logo.svg','avanik/assets/images/avanik-hero.svg'}
              missing=sorted(required-set(names))
              if missing: raise SystemExit('Missing package files: '+', '.join(missing))
              bad=[n for n in names if max((len(x) for x in Path(n).parts), default=0)>120]
              if bad: raise SystemExit('Long filename component remains: '+', '.join(bad))
              if any('NotificationProviderHealthSlaRiskPolicyAuditNotificationDeliveryHealthAlertEscalationDeliveryReliabilityTrend' in n for n in names): raise SystemExit('Known overlong notification filename remains')
              php_files=[n for n in names if n.endswith('.php')]
              functions=z.read('avanik/functions.php').decode('utf-8')
              if '::install();' in functions: raise SystemExit('Database installer is still executed during every request')
              theme_settings=z.read('avanik/inc/ThemeSettings.php').decode('utf-8')
              notification_settings=z.read('avanik/inc/NotificationProviderSettings.php').decode('utf-8')
              notification_dashboard=z.read('avanik/inc/NotificationDashboard.php').decode('utf-8')
              if 'options-general.php' in notification_settings or 'options-general.php' in notification_dashboard: raise SystemExit('Notification management still registered under WordPress Settings')
              if "'تنظیمات قالب'" not in theme_settings or "'avanik-theme-settings'" not in theme_settings: raise SystemExit('Persian Avanik settings menu is missing')
              print('Package verification: PASS; PHP files:', len(php_files))
          PY
          rm -rf package-check
          mkdir package-check
          unzip -q dist/Avanik-Travel-v0.4.0-Hosting-Release.zip -d package-check
          find package-check/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          echo 'Packaged PHP syntax: PASS'
      - name: Generate checksum
        run: sha256sum dist/Avanik-Travel-v0.4.0-Hosting-Release.zip > dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avanik-Travel-v0.4.0-Hosting-Release
          path: |
            dist/Avanik-Travel-v0.4.0-Hosting-Release.zip
            dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='v0.4.0-hosting-complete'
          TITLE='Avanik Travel v0.4.0 — Complete Hosting Release'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Avanik-Travel-v0.4.0-Hosting-Release.zip dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256 --clobber
          else
            gh release create "$TAG" dist/Avanik-Travel-v0.4.0-Hosting-Release.zip dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256 --title "$TITLE" --notes "Complete cPanel/WordPress hosting package for Avanik Travel. Includes the ready-made page installer, functional demo navigation/search/checkout flow, bundled logo and artwork, Persian theme settings panel, Persian provider/notification administration, and cPanel-safe filename handling. Live supplier APIs and production payment credentials remain deployment integrations." --target "$GITHUB_SHA"
          fi
