name: cPanel Hosting Release

on:
  push:
    branches:
      - release/v0.4.1-design-refinement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hosting-zip:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download v0.4.1 hosting builder
        run: |
          set -euo pipefail
          mkdir -p scripts
          curl -L --fail -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/build-hosting-v041.py?ref=${GITHUB_SHA}" -o scripts/build-hosting-v041.py
      - name: Build cPanel-safe hosting package
        run: python3 scripts/build-hosting-v041.py
      - name: Verify package filenames and reference UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('dist/Avanik-Travel-v0.4.0-Hosting-Release.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              required={'avanik/style.css','avanik/functions.php','avanik/front-page.php','avanik/header.php','avanik/footer.php','avanik/inc/Theme.php','avanik/inc/ThemeSetup.php','avanik/inc/ThemeSettings.php','avanik/assets/js/avanik-reference-v041.js','avanik/assets/css/avanik-reference-v041.css','avanik/assets/images/avanik-logo.svg','avanik/assets/images/hero-istanbul.svg'}
              missing=sorted(required-set(names))
              if missing: raise SystemExit('Missing package files: '+', '.join(missing))
              bad=[n for n in names if max((len(x) for x in Path(n).parts), default=0)>120]
              if bad: raise SystemExit('Long filename component remains: '+', '.join(bad))
              front=z.read('avanik/front-page.php').decode('utf-8'); header=z.read('avanik/header.php').decode('utf-8'); settings=z.read('avanik/inc/ThemeSettings.php').decode('utf-8')
              for marker in ['avanik-hero','avanik-search-card','avanik-passenger-field','hero_eyebrow','hero_title_accent']:
                  if marker not in front: raise SystemExit('Missing homepage marker: '+marker)
              if 'ورود / ثبت‌نام' in header: raise SystemExit('Old login text remains in header')
              if 'add_menu_page' not in settings or 'تنظیمات قالب' not in settings: raise SystemExit('Persian theme settings menu missing')
              print('Reference UI/package checks: PASS; files:',len(names))
          PY
          rm -rf package-check && mkdir package-check && unzip -q dist/Avanik-Travel-v0.4.0-Hosting-Release.zip -d package-check
          find package-check/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          echo 'Packaged PHP syntax: PASS'
      - name: Generate checksum
        run: sha256sum dist/Avanik-Travel-v0.4.0-Hosting-Release.zip > dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avanik-Travel-v0.4.0-Hosting-Release
          path: |
            dist/Avanik-Travel-v0.4.0-Hosting-Release.zip
            dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
