name: cPanel Hosting Release

on:
  push:
    branches:
      - release/v0.4.0-cpanel-fixed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hosting-zip:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Prepare builder
        run: |
          mkdir -p scripts
          curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github.raw+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/build-cpanel-hosting-release.py?ref=${GITHUB_SHA}" \
            -o scripts/build-cpanel-hosting-release.py

      - name: Build cPanel-safe hosting package
        run: python3 scripts/build-cpanel-hosting-release.py

      - name: Verify package filenames
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('dist/Avanik-Travel-v0.4.0-Hosting-Release.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              bad=[n for n in names if max((len(x) for x in Path(n).parts), default=0) > 120]
              if bad:
                  print('\n'.join(bad))
                  raise SystemExit('Long filename component remains in hosting package')
              if 'avanik/style.css' not in names:
                  raise SystemExit('Theme root/style.css missing')
              if not any(n.startswith('avanik/') for n in names):
                  raise SystemExit('Theme package is empty')
          print('Package filename validation: PASS')
          PY

      - name: Upload hosting ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avanik-Travel-v0.4.0-Hosting-Release
          path: dist/Avanik-Travel-v0.4.0-Hosting-Release.zip
          if-no-files-found: error
