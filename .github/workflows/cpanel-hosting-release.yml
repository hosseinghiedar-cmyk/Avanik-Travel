name: cPanel Hosting Release

on:
  push:
    branches:
      - release/v0.4.0-hosting-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hosting-zip:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build cPanel-safe hosting package
        run: python3 scripts/build-cpanel-hosting-release.py
      - name: Verify package filenames and required files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('dist/Avanik-Travel-v0.4.0-Hosting-Release.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              required={'avanik/style.css','avanik/functions.php','avanik/front-page.php','avanik/inc/ThemeSetup.php','avanik/inc/ThemeSettings.php','avanik/assets/js/avanik-demo.js','avanik/assets/images/avanik-logo.svg','avanik/assets/images/avanik-hero.svg'}
              missing=sorted(required-set(names))
              if missing: raise SystemExit('Missing package files: '+', '.join(missing))
              bad=[n for n in names if max((len(x) for x in Path(n).parts), default=0)>120]
              if bad: raise SystemExit('Long filename component remains: '+', '.join(bad))
              if any('NotificationProviderHealthSlaRiskPolicyAuditNotificationDeliveryHealthAlertEscalationDeliveryReliabilityTrend' in n for n in names):
                  raise SystemExit('Known overlong notification filename remains')
          print('Package verification: PASS')
          PY
          find wordpress/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Generate checksum
        run: sha256sum dist/Avanik-Travel-v0.4.0-Hosting-Release.zip > dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avanik-Travel-v0.4.0-Hosting-Release
          path: |
            dist/Avanik-Travel-v0.4.0-Hosting-Release.zip
            dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256
      - name: Publish GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='v0.4.0-hosting-complete'
          TITLE='Avanik Travel v0.4.0 — Complete Hosting Release'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Avanik-Travel-v0.4.0-Hosting-Release.zip dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256 --clobber
          else
            gh release create "$TAG" dist/Avanik-Travel-v0.4.0-Hosting-Release.zip dist/Avanik-Travel-v0.4.0-Hosting-Release.sha256 --title "$TITLE" --notes "Complete cPanel/WordPress hosting package for Avanik Travel. Includes the ready-made page installer, functional demo navigation/search/checkout flow, bundled logo and artwork, Persian theme settings panel, and cPanel-safe filename handling. Live supplier APIs and production payment credentials remain deployment integrations." --target "$GITHUB_SHA"
          fi
