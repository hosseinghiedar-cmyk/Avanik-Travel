name: Build Avanik WordPress Theme ZIP

on:
  push:
    paths:
      - 'wordpress/avanik/**'
      - '.github/workflows/build-wordpress-theme.yml'
  workflow_dispatch:

jobs:
  build-theme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download theme files from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf workspace tree.json
          mkdir -p workspace/avanik
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" -o tree.json
          jq -r '.tree[] | select(.type=="blob") | select(.path | startswith("wordpress/avanik/")) | .path' tree.json > theme-files.txt
          test -s theme-files.txt
          while IFS= read -r path; do
            rel="${path#wordpress/avanik/}"
            mkdir -p "workspace/avanik/$(dirname "$rel")"
            curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}" \
              -o "workspace/avanik/$rel"
          done < theme-files.txt

      - name: Validate WordPress theme files
        run: |
          set -euo pipefail
          test -f workspace/avanik/style.css
          test -f workspace/avanik/functions.php
          test -f workspace/avanik/index.php
          test -f workspace/avanik/header.php
          test -f workspace/avanik/footer.php
          find workspace/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build installable ZIP
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          cp -a workspace/avanik package/avanik
          cd package
          zip -qr ../avanik-v0.4.1.zip avanik
          cd ..
          sha256sum avanik-v0.4.1.zip | tee avanik-v0.4.1.sha256

      - name: Upload installable WordPress theme
        uses: actions/upload-artifact@v4
        with:
          name: avanik-v0.4.1-wordpress-theme
          path: |
            avanik-v0.4.1.zip
            avanik-v0.4.1.sha256
