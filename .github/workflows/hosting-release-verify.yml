name: Avanik Hosting Release Verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'wordpress/avanik/**'
      - '.github/workflows/hosting-release-verify.yml'

jobs:
  php-lint-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download required theme files directly from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf workspace tree.json
          mkdir -p workspace/avanik
          curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/trees/${GITHUB_SHA}?recursive=1" -o tree.json
          jq -r '.tree[] | select(.type=="blob") | select(.path | startswith("wordpress/avanik/")) | select((.path | startswith("wordpress/avanik/inc/NotificationProviderHealthSlaRiskPolicyAudit")) | not) | .path' tree.json > theme-files.txt
          test -s theme-files.txt
          while IFS= read -r path; do
            rel="${path#wordpress/avanik/}"
            mkdir -p "workspace/avanik/$(dirname "$rel")"
            curl -L --fail -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${path}" \
              -o "workspace/avanik/$rel"
          done < theme-files.txt
      - name: PHP syntax check
        run: |
          set -e
          find workspace/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify theme metadata and phase files
        run: |
          set -e
          grep -q '^Version: 0.4.0' workspace/avanik/style.css
          test -f workspace/avanik/inc/PhaseLoader.php
          for f in \
            Phase203ProjectStateInventory.php \
            Phase204ProductionSupplierIntegrationReadiness.php \
            Phase205SupplierConnectivityProbe.php \
            Phase206SupplierApiContractReadiness.php \
            Phase207SupplierSandboxProviderMapping.php \
            Phase208SupplierSandboxContractValidation.php \
            Phase209PaymentVerificationReadiness.php \
            Phase210PaymentGatewayVerificationProbe.php \
            Phase211TicketVoucherIssuanceReadiness.php \
            Phase212SecurityHardeningReadiness.php \
            Phase213EndToEndTestReadiness.php \
            Phase214E2ETestExecution.php \
            Phase215LoadStressTestReadiness.php \
            Phase216ControlledLoadStressTest.php \
            Phase217MonitoringAlertingReadiness.php \
            Phase218BackupRestoreReadiness.php \
            Phase219RollbackRecoveryReadiness.php \
            Phase220StagingDeploymentReadiness.php \
            Phase221ReleaseCandidate.php \
            Phase222FinalProductionReadiness.php \
            Phase223ProductionReleaseAuthorization.php \
            Phase224ProductionDeploymentGate.php \
            Phase225PostDeploymentSmokeTest.php \
            Phase226ProductionMonitoringVerification.php \
            Phase227FinalProjectClosure.php; do
            test -f "workspace/avanik/inc/$f"
          done
      - name: Build hosting-safe functions.php
        run: |
          set -e
          cat > workspace/avanik/functions.php <<'PHP'
<?php
defined('ABSPATH') || exit;

$files = [
  'Navigation.php','Theme.php','Booking.php','BookingMeta.php','BookingTemplate.php','BookingRepository.php','BookingSchema.php','BookingLifecycle.php','BookingService.php','BookingActions.php','BookingManagement.php','BookingAdmin.php','BookingPassengers.php','BookingCancellation.php','BookingNotifications.php',
  'PassengerRequirements.php','PassengerDataSecurity.php','PassengerAuditLog.php','PassengerAuditEvents.php','PassengerAccessPolicy.php','PassengerProductionGuard.php','PassengerLegacyMigration.php','PassengerSecurityAdmin.php','PassengerSecurityAuditAdmin.php','PassengerCustomFields.php',
  'Payment.php','PaymentRepository.php','PaymentSchema.php','PaymentService.php','PaymentLifecycle.php','PaymentGatewayInterface.php','CardToCardGateway.php','PaymentSettings.php','ZarinPalGateway.php','BookingPaymentBridge.php','PaymentIdempotency.php',
  'FlightProviderInterface.php','FlightOffer.php','FlightSearchService.php','NullFlightProvider.php','ProviderManager.php','ProviderRepository.php','ProviderConfirmationService.php','BookingProviderBridge.php',
  'TicketingProviderInterface.php','TicketRepository.php','TicketingIdempotency.php','TicketingService.php','BookingTicketBridge.php','TicketOperations.php','TicketAdmin.php','TicketCenter.php','TicketDocumentService.php','TicketPdfRenderer.php','TicketPrivateStorage.php','TicketDocumentEndpoint.php',
  'RefundRepository.php','RefundService.php','BookingRefundBridge.php','RefundSettlement.php','RefundAuditLog.php','RefundIdempotency.php','RefundNotifications.php','RefundCustomerStatus.php','AgencyCommissionReversal.php','RefundGatewayInterface.php','ManualRefundGateway.php','ZarinPalRefundGateway.php','RefundSettlementFields.php','RefundReconciliation.php','RefundReports.php','RefundDashboard.php','RefundNotificationDelivery.php',
  'NotificationCenter.php','NotificationTemplates.php','NotificationInbox.php','NotificationPreferences.php','NotificationRecipientResolver.php','NotificationRecipientContext.php','NotificationRoleInbox.php','NotificationDashboard.php','NotificationDeliveryLog.php','NotificationProviderHealth.php','NotificationProviderAdapter.php','NotificationProviderSettings.php','NotificationProviderResolver.php','NotificationCredentialVault.php','NotificationProviderConnectionTest.php','NotificationProviderTestLog.php','NotificationProviderHealthSummary.php','NotificationProviderHealthAlert.php','NotificationProviderHealthAlertLog.php','NotificationProviderHealthAlertActions.php','NotificationProviderHealthAlertEscalation.php','NotificationProviderHealthAlertRouter.php','NotificationProviderHealthRecovery.php','NotificationProviderHealthRecoveryRouter.php','NotificationProviderHealthIncident.php','NotificationProviderHealthIncidentMetrics.php','NotificationProviderHealthSla.php','NotificationProviderHealthSlaSettings.php','NotificationProviderHealthSlaNotifier.php','NotificationProviderHealthSlaDeliveryAudit.php','NotificationProviderHealthSlaReport.php','NotificationProviderHealthSlaCompliance.php','NotificationProviderHealthSlaTrend.php','NotificationProviderHealthSlaExecutiveSummary.php','NotificationProviderHealthSlaRisk.php','NotificationProviderHealthSlaRiskHistory.php','NotificationProviderHealthSlaRiskAlerts.php','NotificationProviderHealthSlaRiskNotificationPolicy.php','NotificationProviderHealthDashboard.php',
