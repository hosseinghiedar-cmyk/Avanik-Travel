name: Avanik Hosting Release Verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'wordpress/avanik/**'
      - 'scripts/build-cpanel-hosting-release.py'
      - '.github/workflows/hosting-release-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build cPanel-safe package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-cpanel-hosting-release.py
      - name: PHP syntax check all source files
        run: |
          set -euo pipefail
          find wordpress/avanik -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify complete demo installer wiring
        run: |
          set -euo pipefail
          grep -q "ThemeSetup.php" wordpress/avanik/functions.php
          grep -q "ThemeSetup::register" wordpress/avanik/functions.php
          grep -q "data-av-home-search" wordpress/avanik/front-page.php
          grep -q "data-av-search-tab" wordpress/avanik/front-page.php
          grep -q "destination-istanbul.svg" wordpress/avanik/front-page.php
          grep -q "data-av-pay" wordpress/avanik/page-payment.php
          grep -q "data-av-go" wordpress/avanik/page-hotel-details.php
          test -s wordpress/avanik/assets/js/avanik-demo.js
          test -s wordpress/avanik/assets/images/avanik-logo.svg
          test -s wordpress/avanik/assets/images/avanik-hero.svg
          if grep -R -n "HOTEL IMAGE\|HOTEL MAIN IMAGE\|ROOM IMAGE\|POOL IMAGE\|LOBBY IMAGE" wordpress/avanik --include='*.php'; then
            echo 'Placeholder image text remains in PHP templates'
            exit 1
          fi
          if grep -R -n 'href="#"' wordpress/avanik --include='*.php'; then
            echo 'Dead # navigation link remains in PHP templates'
            exit 1
          fi
      - name: Verify ZIP structure and cPanel filename compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('dist/Avanik-Travel-v0.4.0-Hosting-Release.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'avanik/style.css' in names
              assert 'avanik/functions.php' in names
              assert 'avanik/front-page.php' in names
              assert 'avanik/assets/js/avanik-demo.js' in names
              assert 'avanik/assets/images/avanik-logo.svg' in names
              assert 'avanik/assets/images/avanik-hero.svg' in names
              bad=[n for n in names if max((len(x) for x in Path(n).parts), default=0)>120]
              assert not bad, '\n'.join(bad)
              assert all(not n.startswith('avanik/INSTALL-') for n in names)
              assert all(not n.startswith('avanik/RELEASE-MANIFEST') for n in names)
          print('ZIP structure + filename compatibility: PASS')
          PY
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: Avanik-Travel-v0.4.0-Hosting-Release
          path: |
            dist/Avanik-Travel-v0.4.0-Hosting-Release.zip
