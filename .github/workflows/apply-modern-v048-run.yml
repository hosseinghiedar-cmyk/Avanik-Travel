name: Apply Avanik Modern v0.4.8 Run
on:
  push:
    branches: [release/v0.4.0-hosting-complete]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply package
        run: python3 scripts/apply-modern-v048.py
      - name: PHP syntax audit
        run: |
          set -e
          find wordpress/avanik -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Commit generated files
        run: |
          git config user.name 'Avanik Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wordpress/avanik
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Avanik v0.4.8 modern RTL design'
          git push origin HEAD:release/v0.4.0-hosting-complete
